name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Motor de análisis (pytest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -p no:warnings

  frontend:
    name: Interfaz (tipos y compilación)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  tauri:
    name: Contenedor de escritorio (cargo check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # El motor empaquetado se genera en el flujo de instalador; aquí basta un marcador
      # para que tauri-build valide la configuración de recursos.
      - run: New-Item -ItemType Directory -Force build/backend/scriptlens-backend | Out-Null; Set-Content build/backend/scriptlens-backend/LEEME.txt 'marcador de CI'
        shell: pwsh
      - run: cargo check --locked
        working-directory: src-tauri
