name: Instalador de Windows

# Construye el instalador NSIS y su SHA-256 como artefacto descargable.
# No publica releases: la publicación la decide y realiza el autor.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  instalador:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Dependencias
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\pip install -r backend/requirements-dev.txt pyinstaller==6.22.3
          npm ci
          npm --prefix frontend ci
      - name: Pruebas del motor
        shell: pwsh
        run: .\.venv\Scripts\python -m pytest -p no:warnings -q
      - name: Construir instalador
        shell: pwsh
        run: .\scripts\construir_instalador.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: ScriptLens-IA-instalador
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sha256
          if-no-files-found: error
