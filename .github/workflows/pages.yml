name: Página de presentación

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/capturas/**'
      - 'docs/**/*.pdf'
      - 'assets/branding/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    name: Preparar la página
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Reunir archivos
        run: |
          mkdir -p _site/capturas _site/docs
          cp site/index.html site/estilos.css _site/
          cp assets/branding/scriptlens-icon.svg _site/logo.svg
          cp docs/capturas/*.png _site/capturas/
          cp docs/instalacion/Guia_Instalacion_ScriptLens_IA.pdf \
             docs/manual_usuario/Manual_Usuario_ScriptLens_IA.pdf \
             docs/expo_software/ExpoSoftware_2026_II_ScriptLens_IA.pdf \
             docs/desarrollo/Documentacion_Tecnica_ScriptLens_IA.pdf _site/docs/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publicar:
    name: Publicar en GitHub Pages
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
